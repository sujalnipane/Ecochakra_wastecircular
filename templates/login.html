{% extends 'base.html' %}
{% block content %}
<div style="max-width: 400px; margin: 40px auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px;">
    <h2>Login to EcoChakra</h2>
    
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div style="color: red; margin-bottom: 10px;">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST">
        <p>
            <label>Email:</label><br>
            <input type="email" name="email" required style="width: 100%; padding: 8px; margin-top: 5px;">
        </p>
        <p>
            <label>Password:</label><br>
            <input type="password" name="password" required style="width: 100%; padding: 8px; margin-top: 5px;">
        </p>
        <button type="submit" style="background: #2e7d32; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; width: 100%;">Login</button>
    </form>
    <p style="margin-top: 15px;">Account nahi hai? <a href="/register">Register karein</a></p>
</div>
{% endblock %}
